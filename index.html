<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lion School</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="./img//logo-image.png" alt="Logo da Lion School">
            <h2>
                <span>Lion</span>
                <span>School</span>
            </h2>
        </div>
        <div class="logout">
            <img src="./img/VectorSair.png" alt="Botão de Sair">
            <h2>
                <span>Sair</span>
            </h2>
        </div>
    </header>

    <main class="main">
        <!-- Seção do conteúdo da main --> 
        <div class="content-main">
            <div class="section-left">
                <div class="text">
                    <h2>Escolha um <span class="textBlue">curso</span> para gerenciar</h2>                               
                </div>
                <div class="devices">
                    <img src="./img/devices.svg" alt="Dispositivos tecnológicos">
                </div>
            </div>

            <div class="secttion-middle">
                <div class="studant">
                    <img src="./img/studant.svg" alt="Estudante">
                </div>
            </div>

            <div class="section-right">
                <div class="cursos">
                    <div class="ds">
                        <img src="./img/ds.svg" alt="Logo de Desenvolvimento">
                        <h2>DS</h2>
                    </div>  
                    <div class="redes">
                        <img src="./img/redes.svg" alt="Logo de Redes">
                        <h2>REDES</h2>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="contatos">
            <div>
                <img src="./img/telefone.png" alt="">
                <span>(11) 4774-4700</span>
            </div>
            
            <div>
                <img src="./img/icon-email.png" alt="">
                <span>lionschool@gmail.com</span>
            </div>
            
            <div>
                <img src="./img/localizacao.png" alt="">
                <span>Rua tcc, 21, Centro, Jandira</span>
            </div>
        </div>

        <div class="copyright">
            <p>Copyrigth &copy; 2026 | Nicolas dos Santos</p>
        </div>

        <div class="social-media">
            <img src="./img/youtube.png" alt="Logo do youtube">
            <img src="./img/twitter.png" alt="Logo do twitter">
            <img src="./img/instagram.png" alt="Logo do instagram">
            <img src="./img/facebook.png" alt="Logo do facebook">
        </div>
    </footer>
</body>
</html>
